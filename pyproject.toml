[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golfbench"
version = "0.2.0"
description = "Budgeted single-GPU Parameter Golf experiments and controlled search adaptation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
training = ["torch>=2.6", "sentencepiece>=0.2", "huggingface_hub>=0.27"]
llm = ["torch>=2.6", "transformers>=4.57,<6", "safetensors>=0.4"]
plots = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
